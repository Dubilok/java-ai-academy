spring:
  application:
    name: java-ai-academy
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/javaacademy}
    username: ${SPRING_DATASOURCE_USERNAME:academy}
    password: ${SPRING_DATASOURCE_PASSWORD:academy}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-dev-only-secret-at-least-32-chars!!}
    access-token-expiry-ms: 900000
    refresh-token-expiry-days: 30
  sandbox:
    image: ${SANDBOX_IMAGE:java-ai-academy/runner:21}
    memory-bytes: 134217728       # 128 MB
    timeout-seconds: 5
    max-concurrent: 8

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
