spring:
  application:
    name: java-ai-academy
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/javaacademy}
    username: ${SPRING_DATASOURCE_USERNAME:academy}
    password: ${SPRING_DATASOURCE_PASSWORD:academy}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:change-me-dev-only-secret-at-least-32-chars!!}
    access-token-expiry-ms: 900000
    refresh-token-expiry-days: 30
  sandbox:
    image: ${SANDBOX_IMAGE:java-ai-academy/runner:21}
    memory-bytes: 134217728       # 128 MB
    timeout-seconds: 5
    max-concurrent: 8
  llm:
    active-provider: ${LLM_PROVIDER:anthropic}   # anthropic | bedrock
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:change-me-set-in-env}
      base-url: https://api.anthropic.com
      api-version: "2023-06-01"
      default-model: ${ANTHROPIC_MODEL:claude-sonnet-4-6}
      generation-model: ${ANTHROPIC_GENERATION_MODEL:claude-haiku-4-5-20251001}   # cheap first-pass
      healing-model: ${ANTHROPIC_HEALING_MODEL:claude-sonnet-4-6}                 # quality retries
      max-retries: 3
      retry-initial-delay-ms: 1000
      input-cost-per-million-tokens: ${ANTHROPIC_INPUT_COST_PER_MILLION:3.00}
      output-cost-per-million-tokens: ${ANTHROPIC_OUTPUT_COST_PER_MILLION:15.00}
    gemini:
      api-key: ${GEMINI_API_KEY:change-me-set-in-env}
      base-url: https://generativelanguage.googleapis.com
      default-model: ${GEMINI_MODEL:gemini-2.0-flash}
      max-retries: 3
      retry-initial-delay-ms: 1000
    bedrock:
      region: ${AWS_REGION:us-east-1}
      default-model: ${AWS_BEDROCK_MODEL_ID:anthropic.claude-sonnet-4-5-20250514-v1:0}
      max-retries: 3
      retry-initial-delay-ms: 1000
      input-cost-per-million-tokens: ${BEDROCK_INPUT_COST_PER_MILLION:3.00}
      output-cost-per-million-tokens: ${BEDROCK_OUTPUT_COST_PER_MILLION:15.00}
      guardrail-id: ${AWS_BEDROCK_GUARDRAIL_ID:}        # empty = guardrails disabled
      guardrail-version: ${AWS_BEDROCK_GUARDRAIL_VERSION:}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        academy.submission.duration: true
      percentiles:
        academy.submission.duration: 0.5,0.95,0.99
    tags:
      application: java-ai-academy
